name = echotalk
summary = "EchoTalk (emulated Echo II)"
description = """Speech synthesizer driver for an emulated Apple II Echo II card: Street Electronics' original Textalker software running on an emulated 6502, driving an emulation of the TMS5220 speech chip the card was built around. The speech is not imitated -- it is the genuine 1980s article, produced by running the real program. Requires Textalker image files, which are proprietary and not included; supply your own."""
author = "Jayson Smith"
url = https://dragonscave.space/@jaybird110127
